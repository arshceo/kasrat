name: kasrat_ai
description: "Ustad AI - Discipline as a Service"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Camera & ML Kit
  camera: ^0.11.1
  camera_android_camerax: ^0.6.9  # Use CameraX impl — avoids persistent AvailabilityCallback on ColorOS
  google_mlkit_pose_detection: ^0.12.0

  # Auth & Backend
  supabase_flutter: ^2.9.0
  google_sign_in: ^6.2.2

  # Audio
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  speech_to_text: ^7.0.0

  # State & Navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Utilities
  intl: ^0.19.0
  android_alarm_manager_plus: ^5.0.0
  flutter_local_notifications: ^21.0.0
  pedometer: ^4.2.0
  sensors_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
