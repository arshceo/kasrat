name: kasrat_ai
description: "Ustad AI - Discipline as a Service"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.2

  # Camera & ML Kit
  camera: ^0.11.1
  camera_android_camerax: ^0.6.9  # Use CameraX impl — avoids persistent AvailabilityCallback on ColorOS
  google_mlkit_pose_detection: ^0.14.1

  # Auth & Backend
  supabase_flutter: ^2.9.0
  google_sign_in: ^6.2.2

  # Audio
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  speech_to_text: ^7.0.0

  # State & Navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Utilities
  intl: ^0.19.0
  android_alarm_manager_plus: ^5.0.0
  alarm: ^5.2.1
  flutter_local_notifications: ^21.0.0
  pedometer: ^4.2.0
  sensors_plus: ^7.0.0
  google_generative_ai: ^0.4.7
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^12.0.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo3.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo3.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo3.png
  color_dark: "#0A0A0A"
  image_dark: assets/images/logo3.png
  android_12:
    image: assets/images/logo3.png
    color: "#FFFFFF"
    color_dark: "#0A0A0A"
  web: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
